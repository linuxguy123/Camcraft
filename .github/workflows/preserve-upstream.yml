name: Preserve upstream

on:
  schedule:
    # Four checks an hour, away from the busiest minute of each hour.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preserve-upstream
  cancel-in-progress: false

jobs:
  source:
    name: Sync upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge new upstream commits into fork main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/NeoTech/Camcraft.git
          git fetch upstream main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'Fork main already contains upstream main'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit -m 'chore: sync upstream main [skip ci]' FETCH_HEAD
          git push origin HEAD:main

  discussions:
    name: Archive issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/upstream-metadata-20261109
      - name: Save new and updated GitHub records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="docs/upstream-archive/NeoTech-Camcraft-$(date -u +%Y%m%d-%H%M%S)"
          python3 scripts/archive_github_metadata.py NeoTech/Camcraft "$archive" \
            --baseline-root docs/upstream-archive --include-updates --skip-empty
          if [[ ! -d "$archive" ]]; then
            exit 0
          fi
          git add "$archive"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: preserve upstream issues and pull requests'
          git push origin HEAD:archive/upstream-metadata-20261109
